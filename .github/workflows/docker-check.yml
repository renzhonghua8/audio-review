name: Docker build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the deployment image
        run: docker build -t audio-review:ci .
      - name: Start a separate existing-service fixture
        run: |
          set -euo pipefail
          existing_id="$(docker run -d --name audio-review-ci-existing-service \
            --init --no-healthcheck --cpus 0.05 --memory 64m --memory-swap 64m \
            -p 127.0.0.1:9009:9009 --entrypoint python \
            audio-review:ci -m http.server 9009)"
          printf 'EXISTING_SERVICE_ID=%s\n' "$existing_id" >> "$GITHUB_ENV"
          ready=false
          for attempt in {1..30}; do
            status="$(curl --silent --max-time 2 --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:9009/)" || status=''
            if [[ "$status" == 200 ]]; then ready=true; break; fi
            sleep 1
          done
          "$ready" || { docker logs "$existing_id"; exit 1; }
      - name: Start an empty test container
        run: >-
          docker run -d --name audio-review-ci --init
          -e AUDIO_REVIEW_WORKERS=2 -e AUDIO_REVIEW_MODEL_THREADS=1
          -p 127.0.0.1:8001:8001 audio-review:ci
      - name: Verify the actual local model and API
        run: docker exec audio-review-ci python scripts/smoke-test.py
      - name: Remove the first disposable test container
        run: |
          docker logs --tail 100 audio-review-ci
          docker rm -f audio-review-ci
      - name: Verify a forced upgrade interrupts only the owned audio-review service
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/audio-review-parallel-check"
          mkdir -p "$report_dir"
          managed_label=io.github.renzhonghua8.audio-review.managed
          old_id=''
          monitor_pid=''
          stop_monitor="$report_dir/stop-interrupt-service-monitor"
          check_existing() {
            test "$(docker inspect --format '{{.Id}}' audio-review-ci-existing-service)" = "$EXISTING_SERVICE_ID" \
              && test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true \
              && test "$(curl --silent --show-error --max-time 5 --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
          }
          owned_upgrade_fixture() {
            local identifier="$1"
            [[ -n "$identifier" ]] && docker container inspect "$identifier" >/dev/null 2>&1 || return 1
            test "$(docker inspect --format "{{index .Config.Labels \"$managed_label\"}}" "$identifier")" = true \
              && test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' "$identifier")" = /opt/audio-review/data
          }
          finish() {
            result=$?
            trap - EXIT
            touch "$stop_monitor"
            if [[ -n "$monitor_pid" ]]; then wait "$monitor_pid" || result=1; fi
            for identifier in audio-review "$old_id"; do
              if owned_upgrade_fixture "$identifier"; then
                docker logs --tail 200 "$identifier" >> "$report_dir/interrupt-upgrade-container.log" 2>&1 || true
                for evidence in ci-interrupt-state.json ci-interrupt-summary.json; do
                  docker cp "$identifier:/data/$evidence" "$report_dir/$evidence" || true
                done
                docker rm -f "$identifier" || result=1
              fi
            done
            check_existing || result=1
            exit "$result"
          }
          check_existing
          if docker container inspect audio-review >/dev/null 2>&1; then
            echo 'The disposable runner already has an audio-review container; refusing to replace it.' >&2
            exit 1
          fi
          printf 'INTERRUPT_UPGRADE_CI_RUN=1\n' >> "$GITHUB_ENV"
          trap finish EXIT
          (
            while [[ ! -e "$stop_monitor" ]]; do
              status="$(curl --silent --max-time 3 --output /dev/null \
                --write-out '%{http_code}' http://127.0.0.1:9009/)" || status='unavailable'
              printf '%s HTTP %s\n' "$(date -u +%FT%TZ)" "$status" \
                >> "$report_dir/interrupt-upgrade-existing-service.log"
              [[ "$status" == 200 ]] || exit 1
              sleep .5
            done
          ) &
          monitor_pid=$!
          deploy_version="$(awk -F= '$1 == "VERSION" {version=$2; count++} END {if (count != 1) exit 1; print version}' scripts/deploy-docker.sh)"
          [[ "$deploy_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          docker tag audio-review:ci "audio-review:$deploy_version"
          server_ip="$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<NF; i++) if ($i == "src") {print $(i+1); exit}}')"
          test -n "$server_ip"
          sudo -n env AUDIO_REVIEW_MEMORY_MB=768 AUDIO_REVIEW_WORKERS=2 AUDIO_REVIEW_MODEL_THREADS=1 \
            bash scripts/deploy-docker.sh "$server_ip" | tee "$report_dir/interrupt-upgrade-first-deploy.log"
          old_id="$(docker inspect --format '{{.Id}}' audio-review)"
          printf 'INTERRUPT_UPGRADE_OLD_ID=%s\n' "$old_id" >> "$GITHUB_ENV"
          owned_upgrade_fixture "$old_id"
          docker inspect "$old_id" > "$report_dir/interrupt-upgrade-old-container.json"
          test "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NanoCpus}}' "$old_id")" = '805306368 805306368 500000000'
          docker exec audio-review python scripts/smoke-test.py | tee "$report_dir/interrupt-upgrade-baseline.log"
          existing_ip="$(docker inspect --format '{{.NetworkSettings.IPAddress}}' "$EXISTING_SERVICE_ID")"
          docker exec -e INTERRUPT_UPGRADE_TEST_DISPOSABLE=1 \
            -e INTERRUPT_UPGRADE_EXISTING_SERVICE_URL="http://$existing_ip:9009/" \
            audio-review python scripts/interrupt-upgrade-smoke-test.py --phase prepare \
            | tee "$report_dir/interrupt-upgrade-prepare.log"
          check_existing
          sudo -n env AUDIO_REVIEW_MEMORY_MB=768 AUDIO_REVIEW_WORKERS=2 AUDIO_REVIEW_MODEL_THREADS=1 \
            bash scripts/deploy-docker.sh "$server_ip" --upgrade --stop-first --interrupt-tasks \
            | tee "$report_dir/interrupt-upgrade-deploy.log"
          new_id="$(docker inspect --format '{{.Id}}' audio-review)"
          test "$new_id" != "$old_id"
          owned_upgrade_fixture "$new_id"
          docker inspect "$new_id" > "$report_dir/interrupt-upgrade-new-container.json"
          test "$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.MemorySwap}} {{.HostConfig.NanoCpus}}' "$new_id")" = '805306368 805306368 500000000'
          docker exec -e INTERRUPT_UPGRADE_TEST_DISPOSABLE=1 \
            -e INTERRUPT_UPGRADE_EXISTING_SERVICE_URL="http://$existing_ip:9009/" \
            audio-review python scripts/interrupt-upgrade-smoke-test.py --phase verify \
            | tee "$report_dir/interrupt-upgrade-verify.log"
          check_existing
          printf 'Old audio-review ID: %s\nNew audio-review ID: %s\nExisting service ID before and after: %s\n' \
            "$old_id" "$new_id" "$EXISTING_SERVICE_ID" > "$report_dir/interrupt-upgrade-container-identity.log"
          printf 'The separate existing service retained its ID and running state, and every probe returned HTTP 200.\n' \
            >> "$report_dir/interrupt-upgrade-existing-service.log"
      - name: Verify two real model jobs under 768 MiB and 0.5 CPU
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/audio-review-parallel-check"
          mkdir -p "$report_dir"
          test "$(docker inspect --format '{{.Id}}' audio-review-ci-existing-service)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          docker run -d --name audio-review-parallel-ci --init --restart no \
            --cpus 0.5 --cpu-shares 128 --memory 768m --memory-swap 768m --pids-limit 256 \
            -e AUDIO_REVIEW_WORKERS=2 -e AUDIO_REVIEW_MODEL_THREADS=1 \
            -p 127.0.0.1:8001:8001 audio-review:ci
          sudo -n python3 scripts/container-resource-check.py monitor "$report_dir" \
            --container audio-review-parallel-ci &
          monitor_pid=$!
          (
            while true; do
              status="$(curl --silent --show-error --max-time 5 --output /dev/null \
                --write-out '%{http_code}' http://127.0.0.1:9009/)" || status='error'
              printf '%s HTTP %s\n' "$(date -u +%FT%TZ)" "$status" >> "$report_dir/busy-playback-existing-service.log"
              if [[ "$status" != 200 ]]; then touch "$report_dir/busy-playback-existing-service-failed"; exit 1; fi
              sleep 0.5
            done
          ) &
          probe_pid=$!
          finish() {
            result=$?
            trap - EXIT
            kill "$probe_pid" 2>/dev/null || true
            wait "$probe_pid" || true
            if [[ -e "$report_dir/busy-playback-existing-service-failed" ]]; then result=1; fi
            touch "$report_dir/stop-monitor"
            wait "$monitor_pid" || true
            docker logs --tail 200 audio-review-parallel-ci > "$report_dir/container.log" 2>&1 || true
            exit "$result"
          }
          trap finish EXIT
          PARALLEL_TEST_DISPOSABLE=1 PARALLEL_REPORT_DIR="$report_dir" \
            PARALLEL_EXISTING_SERVICE_URL=http://127.0.0.1:9009/ \
            python3 scripts/parallel-smoke-test.py | tee "$report_dir/api.log"
          docker exec -e FORMAT_TEST_DISPOSABLE=1 audio-review-parallel-ci \
            python scripts/media-smoke-test.py | tee "$report_dir/media-format-summary.json"
          existing_ip="$(docker inspect --format '{{.NetworkSettings.IPAddress}}' "$EXISTING_SERVICE_ID")"
          docker exec -e TASK_CONTROL_TEST_DISPOSABLE=1 \
            -e TASK_CONTROL_REPORT_DIR=/tmp/task-control-ci \
            -e TASK_CONTROL_EXISTING_SERVICE_URL="http://$existing_ip:9009/" \
            audio-review-parallel-ci python scripts/task-control-smoke-test.py \
            | tee "$report_dir/task-control.log"
          docker exec -e RECORD_ACTIONS_TEST_DISPOSABLE=1 \
            -e RECORD_ACTIONS_REPORT_DIR=/tmp/task-control-ci \
            -e RECORD_ACTIONS_EXISTING_SERVICE_URL="http://$existing_ip:9009/" \
            audio-review-parallel-ci python scripts/record-actions-smoke-test.py \
            | tee "$report_dir/record-actions.log"
          test ! -e "$report_dir/busy-playback-existing-service-failed"
          touch "$report_dir/stop-monitor"
          wait "$monitor_pid"
          python3 scripts/container-resource-check.py verify "$report_dir" | tee "$report_dir/resources.log"
          test "$(docker inspect --format '{{.Id}}' audio-review-ci-existing-service)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
          printf 'Existing service kept the same container ID, stayed running, and served HTTP 200 before, during, and after both rounds.\n' \
            > "$report_dir/existing-service.log"
      - name: Verify paused tasks survive restarting only the disposable container
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/audio-review-parallel-check"
          docker restart --time -1 audio-review-parallel-ci
          existing_ip="$(docker inspect --format '{{.NetworkSettings.IPAddress}}' "$EXISTING_SERVICE_ID")"
          docker exec -e TASK_CONTROL_TEST_DISPOSABLE=1 \
            -e TASK_CONTROL_REPORT_DIR=/tmp/task-control-ci \
            -e TASK_CONTROL_EXISTING_SERVICE_URL="http://$existing_ip:9009/" \
            audio-review-parallel-ci python scripts/task-control-smoke-test.py --phase verify-restart \
            | tee "$report_dir/task-control-restart.log"
          test "$(docker inspect --format '{{.Id}}' audio-review-ci-existing-service)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
      - name: Save a bounded summary and remove only the CI fixtures
        if: always()
        run: |
          report_dir="$RUNNER_TEMP/audio-review-parallel-check"
          mkdir -p "$report_dir"
          docker logs --tail 100 audio-review-ci || true
          docker logs --tail 200 audio-review-parallel-ci > "$report_dir/container.log" 2>&1 || true
          docker cp audio-review-parallel-ci:/tmp/task-control-ci/. "$report_dir/" || true
          if [[ "${INTERRUPT_UPGRADE_CI_RUN:-}" == 1 ]]; then
            for identifier in audio-review "${INTERRUPT_UPGRADE_OLD_ID:-}"; do
              [[ -n "$identifier" ]] || continue
              if docker container inspect "$identifier" >/dev/null 2>&1 \
                && [[ "$(docker inspect --format '{{index .Config.Labels "io.github.renzhonghua8.audio-review.managed"}}' "$identifier")" == true ]] \
                && [[ "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Source}}{{end}}{{end}}' "$identifier")" == /opt/audio-review/data ]]; then
                docker logs --tail 200 "$identifier" >> "$report_dir/interrupt-upgrade-container.log" 2>&1 || true
                for evidence in ci-interrupt-state.json ci-interrupt-summary.json; do
                  docker cp "$identifier:/data/$evidence" "$report_dir/$evidence" || true
                done
                docker rm -f "$identifier" || true
              fi
            done
          fi
          if [[ -f "$report_dir/ci-interrupt-summary.json" ]]; then
            printf '### Actual host-script upgrade with an active real model task\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$report_dir/ci-interrupt-summary.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$report_dir/resource-summary.json" ]]; then
            printf '### Two concurrent real model jobs, 768 MiB, 0.5 CPU, no swap\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$report_dir/resource-summary.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n\nSynthetic fixtures check execution and resource use, not prediction accuracy or all-input safety.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          docker rm -f audio-review-ci || true
          docker rm -f audio-review-parallel-ci || true
          docker rm -f audio-review-ci-existing-service || true
      - name: Retain resource measurements and API evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parallel-evaluation-768m
          path: ${{ runner.temp }}/audio-review-parallel-check/
          retention-days: 7
          if-no-files-found: warn
