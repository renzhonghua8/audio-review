name: Prebuilt Docker release

on:
  push:
    tags: ['v*']
  # A manual rerun must select an existing version tag, for example:
  # gh workflow run docker-release.yml --ref v2.0.6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'renzhonghua8/audio-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Require an existing version tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]] ||
             [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Run this workflow from an existing version tag such as v2.0.6.' >&2
            exit 1
          fi
          printf 'IMAGE=audio-review:%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the tag commit and build the Linux amd64 image
        run: |
          set -euo pipefail
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$(git rev-parse HEAD)"
          test "$(awk -F= '$1 == "VERSION" { print $2; exit }' scripts/deploy-docker.sh)" = "${GITHUB_REF_NAME#v}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
      - name: Start an existing-service test container
        run: |
          set -euo pipefail
          existing_id="$(docker run -d --name audio-review-existing-service-test \
            --init --no-healthcheck --cpus 0.05 --memory 64m --memory-swap 64m \
            -p 127.0.0.1:9009:9009 --entrypoint python \
            "$IMAGE" -m http.server 9009)"
          printf 'EXISTING_SERVICE_ID=%s\n' "$existing_id" >> "$GITHUB_ENV"
          ready=false
          for attempt in {1..30}; do
            status="$(curl --silent --max-time 2 --output "$RUNNER_TEMP/existing-service-before.html" \
              --write-out '%{http_code}' http://127.0.0.1:9009/)" || status=''
            if [[ "$status" == 200 ]]; then ready=true; break; fi
            sleep 1
          done
          "$ready" || { docker logs audio-review-existing-service-test; exit 1; }
          test "$(docker inspect --format '{{.State.Running}}' "$existing_id")" = true
      - name: Verify a port conflict preserves both existing containers
        run: |
          set -euo pipefail
          port_id="$(docker run -d --name audio-review-port-test \
            --init --no-healthcheck --cpus 0.05 --memory 64m --memory-swap 64m \
            -p 127.0.0.1:8001:8001 --entrypoint python \
            "$IMAGE" -m http.server 8001)"
          conflict_log="$RUNNER_TEMP/audio-review-port-conflict.log"
          if sudo bash scripts/deploy-docker.sh > "$conflict_log" 2>&1; then
            cat "$conflict_log"
            echo 'Deployment unexpectedly succeeded with an occupied port.' >&2
            exit 1
          fi
          cat "$conflict_log"
          grep -Fq '8001 端口已被容器' "$conflict_log"
          test "$(docker inspect --format '{{.Id}}' audio-review-port-test)" = "$port_id"
          test "$(docker inspect --format '{{.State.Running}}' "$port_id")" = true
          test "$(docker inspect --format '{{.Id}}' audio-review-existing-service-test)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
          docker rm -f audio-review-port-test
      - name: Deploy using the actual automatic-IP deployment script
        run: |
          set -euo pipefail
          sudo bash scripts/deploy-docker.sh
          limits="$(docker inspect --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}' audio-review)"
          test "$limits" = '500000000 1073741824 1073741824'
      - name: Verify the local model, API, and preservation of the other service
        run: |
          set -euo pipefail
          docker exec audio-review python scripts/smoke-test.py
          test "$(docker inspect --format '{{.Id}}' audio-review-existing-service-test)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
      - name: Upgrade to 768 MiB and verify saved data and fresh model execution
        run: |
          set -euo pipefail
          docker exec -i audio-review python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import ProxyHandler, build_opener

          client = build_opener(ProxyHandler({}))
          with client.open('http://127.0.0.1:8001/api/reviews', timeout=15) as response:
              rows = json.load(response)['items']
          assert len(rows) == 2 and all(row['status'] == 'done' for row in rows)
          rated = [row for row in rows if row['review']]
          assert len(rated) == 1 and rated[0]['review']['ratings']['clarity'] == 4
          Path('/data/ci-before-768.json').write_text(json.dumps(rows), encoding='utf-8')
          PY
          previous_id="$(docker inspect --format '{{.Id}}' audio-review)"
          sudo env AUDIO_REVIEW_MEMORY_MB=768 bash scripts/deploy-docker.sh --upgrade --stop-first
          test "$(docker inspect --format '{{.Id}}' audio-review)" != "$previous_id"
          limits="$(docker inspect --format '{{.HostConfig.NanoCpus}} {{.HostConfig.Memory}} {{.HostConfig.MemorySwap}}' audio-review)"
          test "$limits" = '500000000 805306368 805306368'
          test "$(docker inspect --format '{{.Id}}' audio-review-existing-service-test)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
          docker exec -i audio-review python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import time
          from urllib.request import Request, ProxyHandler, build_opener

          base = 'http://127.0.0.1:8001'
          client = build_opener(ProxyHandler({}))

          def api(path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              request = Request(base + path, data=data,
                                headers={'Content-Type': 'application/json'} if data else {})
              with client.open(request, timeout=15) as response:
                  return json.load(response)

          snapshot_path = Path('/data/ci-before-768.json')
          before = json.loads(snapshot_path.read_text(encoding='utf-8'))
          assert api('/api/reviews')['items'] == before, 'Upgrade changed saved results or human ratings'
          for row in before:
              with client.open(base + '/api/audio/' + row['id'], timeout=15) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == row['sha256']
          health = api('/api/health')
          assert health['ready'] and health['evaluator_version'] == '2.0'
          assert health['workers'] == 2 and health['model_threads'] == 1
          target = next(row for row in before if row['review'])
          submitted = api('/api/run', {'ids': [target['id']], 'scope': 'fast', 'force': True})
          assert submitted['submitted'] == [target['id']] and not submitted['reused']
          for attempt in range(120):
              recalculated = api('/api/reviews/' + target['id'])
              assert recalculated['status'] != 'error', recalculated
              if recalculated['status'] == 'done':
                  break
              time.sleep(.5)
          else:
              raise RuntimeError('Fresh 768 MiB model scoring timed out')
          assert recalculated['result']['quality'] == target['result']['quality']
          assert not recalculated['result']['processing']['cache_hit']
          assert recalculated['result']['processing']['elapsed_seconds'] > 0
          assert recalculated['review'] == target['review']
          for saved in before:
              if saved['id'] != target['id']:
                  assert api('/api/reviews/' + saved['id']) == saved
          assert api('/api/health')['ready']
          snapshot_path.unlink()
          print('PASS: 768 MiB upgrade, unchanged audio/results/human ratings, fresh ONNX scoring, healthy API')
          PY
          test "$(docker inspect --format '{{.Id}}' audio-review-existing-service-test)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
      - name: Verify media formats and compatible playback in the released image
        run: |
          set -euo pipefail
          docker exec -e FORMAT_TEST_DISPOSABLE=1 audio-review python scripts/media-smoke-test.py
          test "$(docker inspect --format '{{.Id}}' audio-review-existing-service-test)" = "$EXISTING_SERVICE_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$EXISTING_SERVICE_ID")" = true
          test "$(curl --silent --show-error --max-time 5 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:9009/)" = 200
      - name: Export the tested image and its checksum
        run: |
          set -euo pipefail
          mkdir -p release
          docker save "$IMAGE" | gzip -1 > release/audio-review-linux-amd64.tar.gz
          cd release
          sha256sum audio-review-linux-amd64.tar.gz > audio-review-linux-amd64.tar.gz.sha256
          sha256sum --check audio-review-linux-amd64.tar.gz.sha256
          docker load --input audio-review-linux-amd64.tar.gz
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE")" = amd64
          test "$(docker image inspect --format '{{index .Config.Labels "io.github.renzhonghua8.audio-review.managed"}}' "$IMAGE")" = true
          cat > notes.md <<'NOTES'
          声检 Linux x86_64 预构建 Docker 镜像，包含本地 DNSMOS 模型、FFmpeg 和 Python 依赖。

          服务端只需下载、校验并导入镜像，不需要在已有服务的服务器上构建镜像。
          发布前已实际执行自动识别网卡 IP 的部署脚本，验证 8001 端口冲突时保留原容器，并确认另一项模拟服务的容器 ID、运行状态和 HTTP 200 响应在部署前后保持正常。
          默认同时评测两条不同音频，其余自动排队；模型线程为 1。网页显示真实上传进度、逐条服务器确认和失败重试，导入期间可继续追加多条音频。
          上传按真实音轨识别，支持当前 FFmpeg 能解码的本地音频及视频音轨；自动准备兼容 MP3 回听，原文件和自动评分保持不变。网页在分段读取失败时会自动切换为整文件加载，并显示真实载入进度。
          新增 --upgrade --stop-first：需要释放旧实例内存时，可先正常关闭仅属于声检的旧容器，再复查内存、导入镜像并启动新版；失败恢复原实例，仍保留 512 MiB 宿主余量。
          在 0.5 CPU / 1 GiB 内存、双任务单模型线程的容器中检查健康接口、音频解码、音质评分、重复任务复用和人工评分独立保存；再通过部署脚本升级至 768 MiB，确认双任务配置、原音频、自动结果和人工评分保留，并强制重新运行实际模型，另一项模拟服务继续正常运行。
          导出的包已再次校验 SHA256、导入并检查 amd64 架构和声检管理标记。

          `audio-review-linux-amd64.tar.gz.sha256` 用于检查镜像包下载是否完整。
          部署步骤请查看仓库中的 Docker部署说明.md。
          评测算法版本仍为 2.0；合成音频仅检查执行流程，不代表预测准确性验证。
          NOTES
      - name: Publish only this repository's release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: renzhonghua8/audio-review
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/audio-review-linux-amd64.tar.gz \
              release/audio-review-linux-amd64.tar.gz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/audio-review-linux-amd64.tar.gz \
              release/audio-review-linux-amd64.tar.gz.sha256 \
              --verify-tag --title "声检 ${GITHUB_REF_NAME#v}" \
              --notes-file release/notes.md
          fi
      - name: Show logs and remove only the three named CI test containers
        if: always()
        run: |
          for container in audio-review audio-review-existing-service-test audio-review-port-test; do
            docker logs --tail 100 "$container" || true
            docker rm -f "$container" || true
          done
